[project]
name = "chx-pipelines"
version = "1.0.0"
requires-python = ">=3.11,<3.12"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64"]

[tool.pixi.dependencies]
ipykernel = ">=6.29.5,<7"
databroker = ">=2.0.0b4,<3"
sparse = ">=0.15,<1"
awkward = ">=2.8.1,<3"
xarray = ">=2025.3.1,<2026"
matplotlib = ">=3.10.1,<4"
scikit-beam = ">=0.0.26,<0.0.27"
modestimage = ">=0.2,<0.3"
xray-vision = ">=0.1.1,<0.2"
eiger-io = ">=2.0.4,<3"
pyolog = ">=4.5.1,<5"
papermill = ">=2.6.0,<3"
termcolor = ">=3.0.1,<4"
jupytext = ">=1.17.0,<2"

[tool.pixi.pypi-dependencies]
chx-pipelines = { path = ".", editable = true }
tiled = ">=0.1.0b20, <0.2"
filestore = ">=1.0.7, <2"
pyCHX = {path = "../pyCHX", editable=true}